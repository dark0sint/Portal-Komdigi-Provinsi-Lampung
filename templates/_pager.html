{% macro pager(page, pages) %}
{% if pages > 1 %}
<nav class="pager" aria-label="Halaman hasil">
  {% if page > 1 %}<a href="{{ page_url(page-1) }}" rel="prev">Sebelumnya</a>{% endif %}
  {% for n in range(1, pages+1) %}{% if n == page %}<span aria-current="page">{{ n }}</span>{% else %}<a href="{{ page_url(n) }}" aria-label="Halaman {{ n }}">{{ n }}</a>{% endif %}{% endfor %}
  {% if page < pages %}<a href="{{ page_url(page+1) }}" rel="next">Berikutnya</a>{% endif %}
</nav>
{% endif %}
{% endmacro %}
