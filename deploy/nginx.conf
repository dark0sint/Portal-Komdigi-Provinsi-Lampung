# /etc/nginx/sites-available/komdigi-lampung   (lalu: certbot --nginx -d domain-anda.go.id)
server {
    listen 80;
    server_name domain-anda.go.id;
    client_max_body_size 2m;
    gzip on; gzip_types text/css application/javascript image/svg+xml application/json text/csv;
    location /static/ { alias /opt/komdigi-lampung/static/; expires 30d; access_log off; }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
