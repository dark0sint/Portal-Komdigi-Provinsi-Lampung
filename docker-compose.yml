# Jalankan: cp .env.example .env  (isi)  lalu:  docker compose up -d --build
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /srv/data
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
    volumes:
      - portal_data:/srv/data
    expose:
      - "8000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
volumes:
  portal_data:
  caddy_data:
  caddy_config:
